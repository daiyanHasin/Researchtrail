[package]
name = "researchtrail"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A local research notebook that connects the papers you read to the code you write."
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "2.10", features = ["json"] }
scraper = "0.20"
tree-sitter = "0.22"
tree-sitter-python = "0.21"
similar = "2"
sha2 = "0.10"
pdf-extract = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
